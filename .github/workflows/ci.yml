name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The whole suite against a real server over TLS 1.3 (Beryl, the default),
  # plus the TLS and caching_sha2_password checks in spec/tls_spec.cr. Each
  # image is pinned by digest.
  test:
    name: specs (MySQL ${{ matrix.mysql.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql:
          - version: "8.4.13"
            digest: "8c233bad33d520a7aae1c1e619c3a9775f4a1ba2d463d692fada04ec7f40be00"
          - version: "9.7.4"
            digest: "1f2ca53a9e94ff9f1f313099fa7dc7fb2f72e180ca5b2ef83574031e451bbbf1"
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh apt package index
        run: sudo apt-get update
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Install shards
        run: shards install --frozen
      - name: Start the TLS test servers
        run: scripts/tls_test_servers.sh "mysql:${{ matrix.mysql.version }}@sha256:${{ matrix.mysql.digest }}" "$RUNNER_TEMP/certs" >> "$GITHUB_ENV"
      - name: Run specs (Beryl TLS)
        run: crystal spec
      - name: Run specs (-Duse_openssl)
        run: crystal spec -Duse_openssl spec/tls_spec.cr spec/auth_spec.cr spec/connection_options_spec.cr
        env:
          # OpenSSL negotiates TLS 1.2 with the TLS 1.2 server, so that check is Beryl's only.
          MYSQL_TLS12_URL: ""
      - name: Link check (no OpenSSL by default)
        run: |
          printf 'require "./src/mysql"\nDB.open(ENV["URL"]) { |db| puts db.scalar("SELECT 1") }\n' > link_probe.cr
          crystal build link_probe.cr -o link_probe
          URL="mysql://root@127.0.0.1?ssl-mode=required" ./link_probe
          ldd link_probe
          ! ldd link_probe | grep -E 'libssl|libcrypto'
          test "$(nm -u link_probe | grep -Ec '(SSL|EVP|OPENSSL)_' || true)" = 0

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Download source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1
        with:
          crystal: 1.21.0
      - name: Check formatting
        run: crystal tool format --check src spec
